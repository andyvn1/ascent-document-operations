<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Ascent Review{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; vertical-align: top; }
    th { background: #f4f4f4; }
    tr.low-confidence { background: #fff3cd; }
    tr.missing { background: #f8d7da; }
    nav { margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; }
    .error { color: #842029; background: #f8d7da; padding: 0.5rem 0.75rem; border-radius: 4px; margin: 0.5rem 0; }
    form.inline { display: inline; }
    .preview { width: 100%; height: 70vh; border: 1px solid #ccc; }
    .columns { display: flex; gap: 2rem; align-items: flex-start; }
    .columns > div { flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <nav>
    <a href="/review">Review Queue</a>
    <a href="/upload">Upload</a>
    <a href="/logout">Logout</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
